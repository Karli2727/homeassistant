alias: "Onleihe: Neue Bücher benachrichtigen"
description: "Empfängt neue Onleihe-Titel vom Pi-Skript und sendet eine Push-Nachricht."
mode: queued
triggers:
  - trigger: webhook
    webhook_id: onleihe_neue_buecher
    allowed_methods:
      - POST
    local_only: true
actions:
  - action: notify.mobile_app_DEIN_HANDY  # <- An deinen Handy-Notify-Dienst anpassen
    data:
      title: "{{ trigger.json.title }}"
      message: "{{ trigger.json.message }}"
      data:
        clickAction: "app://de.divibib.onleihe3"
