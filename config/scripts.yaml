ev5_smart_klima_starten:
  alias: EV5 Smarte Vorklimatisierung starten
  icon: mdi:car-defrost-front
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: lock.ev5_zentralverriegelung
      state: unlocked
    - condition: state
      entity_id: binary_sensor.ev5_tur_vorne_links
      state: 'off'
    - condition: state
      entity_id: binary_sensor.ev5_tur_vorne_rechts
      state: 'off'
    - condition: state
      entity_id: binary_sensor.ev5_tur_hinten_links
      state: 'off'
    - condition: state
      entity_id: binary_sensor.ev5_tur_hinten_rechts
      state: 'off'
    - condition: state
      entity_id: binary_sensor.ev5_kofferraum
      state: 'off'
    then:
    - action: lock.lock
      continue_on_error: true
      target:
        entity_id: lock.ev5_zentralverriegelung
    - delay:
        seconds: 10
  - variables:
      ws: '{{ states(''sensor.wettersensor_temperature'') }}'
      temp: '{{ ws | float if ws not in [''unknown'', ''unavailable'', ''none''] else
        (state_attr(''weather.forecast_home'', ''temperature'') | float(10)) }}'
      target_temp: '{{ 22.0 if temp < 4 else (21.5 if temp < 18 else (20.5 if temp
        < 23 else 19.5)) }}'
      use_defrost: '{{ temp < 4 }}'
      use_heating: '{{ ''1'' if temp < 18 else ''0'' }}'
  - action: kia_uvo.start_climate
    data:
      device_id: f551a60bb030d66d76443b526be88415
      duration: 15
      climate: true
      temperature: '{{ target_temp }}'
      defrost: '{{ use_defrost }}'
      heating: '{{ use_heating }}'
  - delay:
      seconds: 5
  - action: kia_uvo.update
    continue_on_error: true
    data:
      device_id: f551a60bb030d66d76443b526be88415
