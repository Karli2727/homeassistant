s6_kamera_auslosen:
  alias: Biomechanik S6 Aufnahme mit Timer
  sequence:
  - action: notify.mobile_app_s6
    data:
      message: command_screen_on
  - delay:
      milliseconds: 1500
  - action: notify.mobile_app_s6
    data:
      message: command_activity
      data:
        intent_action: android.media.action.VIDEO_CAPTURE
  - delay:
      milliseconds: 1500
  - action: androidtv.adb_command
    target:
      entity_id: media_player.s6
    data:
      command: input keyevent 24
  - delay:
      seconds: '{{ states(''input_number.aufnahme_dauer'') | int(10) }}'
  - action: androidtv.adb_command
    target:
      entity_id: media_player.s6
    data:
      command: input keyevent 24
  - delay:
      milliseconds: 1500
  - action: androidtv.adb_command
    target:
      entity_id: media_player.s6
    data:
      command: input keyevent 26
  mode: single
  icon: mdi:video-switch
  description: Weckt das S6 auf, startet die Aufnahme, wartet die im Helfer definierte
    Dauer ab, stoppt sie und schaltet den Bildschirm aus.
s22_fe_kamera_test:
  alias: Biomechanik S22FE Aufnahme mit Timer
  sequence:
  - action: androidtv.adb_command
    target:
      entity_id: media_player.s22fe
    data:
      command: input keyevent 26
  - delay:
      milliseconds: 1000
  - action: remote.send_command
    target:
      entity_id: remote.s22fe
    data:
      command: am start -a android.media.action.STILL_IMAGE_CAMERA
  - delay:
      milliseconds: 2000
  - action: remote.send_command
    target:
      entity_id: remote.s22fe
    data:
      command: input tap 955 1775
  - delay:
      milliseconds: 1500
  - action: remote.send_command
    target:
      entity_id: remote.s22fe
    data:
      command: input tap 550 1150
  - delay:
      milliseconds: 2500
  - action: remote.send_command
    target:
      entity_id: remote.s22fe
    data:
      command: input tap 540 2030
  - delay:
      seconds: '{{ states(''input_number.aufnahme_dauer'') | int(10) }}'
  - action: remote.send_command
    target:
      entity_id: remote.s22fe
    data:
      command: input tap 620 2030
  - delay:
      milliseconds: 1000
  - action: remote.send_command
    target:
      entity_id: remote.s22fe
    data:
      command: input keyevent 3
  - action: androidtv.adb_command
    target:
      entity_id: media_player.s22fe
    data:
      command: input keyevent 26
  mode: single
  icon: mdi:video-switch
  description: Startet die Kamera, wartet die im Helfer definierte Dauer ab, stoppt
    die Aufnahme und schaltet den Bildschirm aus.
