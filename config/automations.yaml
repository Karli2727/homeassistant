- id: '202611170001'
  alias: go-e KS EV5 Verstell-Warnung an Karl
  description: Sendet eine Push-Warnung mit Rückgängig-Button an Karl, sobald Helmuth
    (oder jemand anderes) am EV5 etwas umstellt.
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - input_select.goe_ks_lademodus
    - input_number.goe_ks_auto_ziel_soc
    - input_number.goe_ks_auto_min_soc
    - input_number.goe_ks_bat_prio_soc
    - input_number.goe_ks_forecast_schwelle
    - input_number.goe_ks_max_netzbezug_kw
    - select.goe_337853_frc
    - number.goe_337853_amp
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none and trigger.from_state.state not in [''unknown'', ''unavailable''] and
      trigger.to_state.state not in [''unknown'', ''unavailable''] and trigger.from_state.state
      != trigger.to_state.state and trigger.to_state.context.user_id is not none
      and trigger.to_state.context.user_id != ''fea8ca13040a4551987ca8c696299776''
      and trigger.to_state.context.parent_id is none }}'
  actions:
  - variables:
      uid: '{{ trigger.to_state.context.user_id }}'
      who: '{{ {''5f84c9d63e7c4f0987a3ff303bca3a43'': ''Helmuth'', ''e9ae2c4d13f840fb8ac2a89f70e1550e'':
        ''Lisa'', ''b1319b30e6bc460db42cdaa9d8820776'': ''Marcouscous''}.get(uid, ''Jemand'')
        }}'
      labels:
        input_select.goe_ks_lademodus: Lademodus
        input_number.goe_ks_auto_ziel_soc: Auto-Ladeziel (%)
        input_number.goe_ks_auto_min_soc: Not-Reserve (%)
        input_number.goe_ks_bat_prio_soc: Batteriespeicher-Priorität (%)
        input_number.goe_ks_forecast_schwelle: PV-Forecast Schwelle (kWh)
        input_number.goe_ks_max_netzbezug_kw: Max. Netzbezug Limit (kW)
        select.goe_337853_frc: Wallbox Force-Status
        number.goe_337853_amp: Ladestrom (A)
      label: '{{ labels.get(trigger.entity_id, trigger.entity_id) }}'
      frc_names:
        '0': 0 (Neutral)
        '1': 1 (Aus)
        '2': 2 (Ein)
      old_disp: '{{ frc_names.get(trigger.from_state.state, trigger.from_state.state)
        if trigger.entity_id == ''select.goe_337853_frc'' else trigger.from_state.state
        }}'
      new_disp: '{{ frc_names.get(trigger.to_state.state, trigger.to_state.state)
        if trigger.entity_id == ''select.goe_337853_frc'' else trigger.to_state.state
        }}'
      undo_action: '{{ ''UNDO_EV5_CHANGE|'' ~ trigger.entity_id ~ ''|'' ~ trigger.from_state.state
        }}'
  - action: notify.mobile_app_karl_s_s26
    continue_on_error: true
    data:
      title: '⚠️ EV5 verstellt durch {{ who }}'
      message: '{{ label }} wurde von „{{ old_disp }}“ auf „{{ new_disp }}“ geändert.'
      data:
        tag: 'ev5_change_{{ trigger.entity_id }}'
        importance: high
        actions:
        - action: '{{ undo_action }}'
          title: ↩️ Rückgängig machen
- id: '202611170002'
  alias: go-e KS EV5 Verstell-Warnung Undo Action
  description: Stellt die vorherige EV5-Einstellung nach Klick auf Rückgängig in der
    Push-Benachrichtigung wieder her.
  mode: queued
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.action is defined and trigger.event.data.action.startswith(''UNDO_EV5_CHANGE|'')
      }}'
  actions:
  - variables:
      parts: '{{ trigger.event.data.action.split(''|'', 2) }}'
      ent: '{{ parts[1] }}'
      old_val: '{{ parts[2] }}'
      domain: '{{ ent.split(''.'')[0] }}'
      labels:
        input_select.goe_ks_lademodus: Lademodus
        input_number.goe_ks_auto_ziel_soc: Auto-Ladeziel (%)
        input_number.goe_ks_auto_min_soc: Not-Reserve (%)
        input_number.goe_ks_bat_prio_soc: Batteriespeicher-Priorität (%)
        input_number.goe_ks_forecast_schwelle: PV-Forecast Schwelle (kWh)
        input_number.goe_ks_max_netzbezug_kw: Max. Netzbezug Limit (kW)
        select.goe_337853_frc: Wallbox Force-Status
        number.goe_337853_amp: Ladestrom (A)
      label: '{{ labels.get(ent, ent) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ domain == ''input_select'' }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: '{{ ent }}'
        data:
          option: '{{ old_val }}'
    - conditions:
      - condition: template
        value_template: '{{ domain == ''input_number'' }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: '{{ ent }}'
        data:
          value: '{{ old_val | float }}'
    - conditions:
      - condition: template
        value_template: '{{ domain == ''select'' }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: '{{ ent }}'
        data:
          option: '{{ old_val }}'
    - conditions:
      - condition: template
        value_template: '{{ domain == ''number'' }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: '{{ ent }}'
        data:
          value: '{{ old_val | float }}'
  - action: notify.mobile_app_karl_s_s26
    continue_on_error: true
    data:
      title: ✅ EV5 Einstellung wiederhergestellt
      message: '{{ label }} wurde auf „{{ old_val }}“ zurückgesetzt.'
      data:
        tag: 'ev5_change_{{ ent }}'
- id: '202611160010'
  alias: Velux Stromwächter (Auto-Einschalten)
  description: Stellt sicher, dass das Velux KLF-200 Gateway nach einem HA-Neustart oder versehentlichem Ausschalten immer eingeschaltet ist.
  mode: restart
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: switch.licht_tischlampe_fernseher
    to: 'off'
    for:
      seconds: 25
  actions:
  - delay:
      seconds: 5
  - condition: state
    entity_id: switch.licht_tischlampe_fernseher
    state: 'off'
  - action: switch.turn_on
    target:
      entity_id: switch.licht_tischlampe_fernseher
- id: '202611170003'
  alias: EV5 Smarte Kindergarten-Vorklimatisierung (07:15)
  description: Startet Mo-Fr um 07:15 Uhr automatisch Heizen/Enteisen (Winter) oder
    Kühlen (Sommer) 15 Min vor Abfahrt um 07:30 Uhr.
  mode: single
  triggers:
  - trigger: time
    at: 07:15:00
  conditions:
  - condition: state
    entity_id: input_boolean.ev5_smart_klima_morgens
    state: 'on'
  - condition: template
    value_template: '{{ now().weekday() < 5 }}'
  - condition: template
    value_template: '{{ is_state(''device_tracker.ev5_ort'', ''home'') or is_state(''binary_sensor.goe_337853_car_0'',
      ''on'') }}'
  - condition: template
    value_template: '{{ (states(''sensor.ev5_ladestand_ev_batterie'') | float(50))
      >= 20 }}'
  - condition: template
    value_template: '{% set ws = states(''sensor.wettersensor_temperature'') %} {%
      set t = ws | float if ws not in [''unknown'', ''unavailable'', ''none''] else
      (state_attr(''weather.forecast_home'', ''temperature'') | float(10)) %} {{ t
      < 17 or t >= 23 }}'
  actions:
  - action: script.ev5_smart_klima_starten
  - variables:
      ws: '{{ states(''sensor.wettersensor_temperature'') }}'
      t: '{{ ws | float if ws not in [''unknown'', ''unavailable'', ''none''] else
        (state_attr(''weather.forecast_home'', ''temperature'') | float(10)) }}'
      mode_txt: '{{ ''❄️ Frost-Enteisung (22 °C)'' if t < 4 else (''🔥 Vorheizen (21,5 °C)''
        if t < 17 else ''☀️ Sommer-Kühlen (19,5 °C)'') }}'
  - action: notify.mobile_app_karl_s_s26
    continue_on_error: true
    data:
      title: 🚗 EV5 Kindergarten-Klima aktiv
      message: '{{ mode_txt }} bei {{ t | round(1) }} °C Außentemperatur für 15 Min
        gestartet (Abfahrt 07:30).'
- id: '202611180001'
  alias: EEG Batteriespeicher Klein Schoderleh mit Hof-Überschuss laden
  description: Lädt bei aktivierter EEG-Kopplung überschüssigen Hof-Strom (Gut Schoderleh)
    per Fronius Modbus TCP in den Reserva Batteriespeicher Klein Schoderleh.
  mode: single
  triggers:
  - trigger: time_pattern
    seconds: /30
  - trigger: state
    entity_id: input_boolean.eeg_ueberschuss_aktiv
    to: 'off'
    id: turned_off
  - trigger: homeassistant
    event: start
    id: ha_start
  actions:
  - variables:
      eeg_aktiv: '{{ is_state(''input_boolean.eeg_ueberschuss_aktiv'', ''on'') }}'
      gs_einspeisung: '{{ states(''sensor.solarnet_gs_leistung_netzeinspeisung'') | float(0)
        }}'
      gs_bezug: '{{ states(''sensor.solarnet_gs_leistung_netzbezug'') | float(0) }}'
      hof_surplus: '{{ [0, gs_einspeisung - gs_bezug] | max }}'
      ks_pv: '{{ states(''sensor.solarnet_ks_pv_leistung'') | float(0) }}'
      ks_verbrauch: '{{ states(''sensor.solarnet_ks_leistung_verbrauch'') | float(0)
        }}'
      car_w: '{{ states(''sensor.goe_337853_nrg_11'') | float(0) }}'
      ks_soc: '{{ states(''sensor.reserva_ks_ladezustand'') | float(0) }}'
      prio_soc: '{{ states(''input_number.goe_ks_bat_prio_soc'') | float(50) }}'
      bat_ziel_soc: '{{ states(''input_number.eeg_ks_batterie_ziel_soc'') | float(90)
        }}'
      car_plugged: '{{ is_state(''binary_sensor.goe_337853_car_0'', ''on'') }}'
      car_waiting_pv: '{{ car_plugged and (states(''input_select.goe_ks_lademodus'')
        in [''Smart (Auto-Prio)'', ''PV-Überschuss'']) and ((states(''sensor.ev5_ladestand_ev_batterie'')
        | float(50)) < (states(''input_number.goe_ks_auto_ziel_soc'') | float(80))) }}'
      eff_bat_ziel: '{{ prio_soc if car_waiting_pv else bat_ziel_soc }}'
      house_no_car: '{{ [0, ks_verbrauch - car_w] | max }}'
      local_pv_excess: '{{ [0, ks_pv - house_no_car] | max }}'
      house_grid_need: '{{ [0, house_no_car - ks_pv] | max }}'
      eeg_for_bat: '{{ [0, hof_surplus - house_grid_need] | max }}'
      max_grid_w: '{{ (states(''input_number.goe_ks_max_netzbezug_kw'') | float(11)) * 1000
        }}'
      grid_headroom: '{{ [0, max_grid_w - house_grid_need - car_w] | max }}'
      allowed_eeg_bat: '{{ [eeg_for_bat, grid_headroom] | min }}'
      target_bat_w: '{{ [4800, (local_pv_excess + allowed_eeg_bat) | round(0)] | min }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''turned_off'', ''ha_start''] and not eeg_aktiv }}'
      sequence:
      - action: shell_command.fronius_ks_battery_charge
        data:
          watts: 0
    - conditions:
      - condition: template
        value_template: '{{ eeg_aktiv and ks_soc < eff_bat_ziel and allowed_eeg_bat
          >= 600 and target_bat_w >= 600 }}'
      sequence:
      - action: shell_command.fronius_ks_battery_charge
        data:
          watts: '{{ target_bat_w | int }}'
    - conditions:
      - condition: template
        value_template: '{{ eeg_aktiv and (ks_soc >= eff_bat_ziel or allowed_eeg_bat
          < 400) }}'
      sequence:
      - action: shell_command.fronius_ks_battery_charge
        data:
          watts: 0
- id: '202611180002'
  alias: KIA AC-Ladelimit Hardware-Fallback Synchronisation
  description: Synchronisiert das Dashboard-Ladeziel mit dem fahrzeuginternen Kia-BMS AC-Ladelimit (50–100 %, 10er-Schritte) als Hardware-Abschaltschutz bei Pi-Ausfall.
  mode: queued
  triggers:
  - trigger: state
    entity_id: input_number.goe_ks_auto_ziel_soc
    for:
      seconds: 5
    id: ks
  - trigger: state
    entity_id: input_number.goe_gs_auto_ziel_soc
    for:
      seconds: 5
    id: gs
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: ks
      sequence:
      - variables:
          target_limit: '{{ [50, [100, ((states(''input_number.goe_ks_auto_ziel_soc'') | float(80) / 10) | round(0) * 10) | int] | min] | max }}'
      - if:
        - condition: template
          value_template: '{{ states(''number.ev5_ac_ladelimit'') not in [''unknown'', ''unavailable''] and (states(''number.ev5_ac_ladelimit'') | int(80)) != (target_limit | int) }}'
        then:
        - action: number.set_value
          continue_on_error: true
          target:
            entity_id: number.ev5_ac_ladelimit
          data:
            value: '{{ target_limit | int }}'
    - conditions:
      - condition: trigger
        id: gs
      sequence:
      - variables:
          target_limit: '{{ [50, [100, ((states(''input_number.goe_gs_auto_ziel_soc'') | float(80) / 10) | round(0) * 10) | int] | min] | max }}'
      - if:
        - condition: template
          value_template: '{{ states(''number.e_niro_ac_ladelimit'') not in [''unknown'', ''unavailable''] and (states(''number.e_niro_ac_ladelimit'') | int(80)) != (target_limit | int) }}'
        then:
        - action: number.set_value
          continue_on_error: true
          target:
            entity_id: number.e_niro_ac_ladelimit
          data:
            value: '{{ target_limit | int }}'
- id: '202611180003'
  alias: KIA EV5 & e-Niro Intelligenter Live-SoC Refresh
  description: Erzwingt ein Live-Update über Mobilfunk nur schonend beim Anstecken (falls Stand > 2 Std. alt) und max. 1x täglich um 18:00 Uhr (falls EV5-Stand > 12 Std. alt). Kein Dauer-Polling während der Ladung.
  mode: queued
  triggers:
  - trigger: state
    entity_id: binary_sensor.goe_337853_car_0
    from: 'off'
    to: 'on'
    for:
      seconds: 10
    id: ev5_plugged
  - trigger: state
    entity_id: binary_sensor.goe_081320_car_0
    from: 'off'
    to: 'on'
    for:
      seconds: 10
    id: niro_plugged
  - trigger: time
    at: '18:00:00'
    id: daily_check
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: ev5_plugged
      - condition: template
        value_template: '{{ states(''sensor.ev5_zuletzt_aktualisiert'') not in [''unknown'', ''unavailable'', ''none''] and (as_timestamp(now()) - as_timestamp(states(''sensor.ev5_zuletzt_aktualisiert''), 0)) > 7200 }}'
      sequence:
      - action: button.press
        continue_on_error: true
        target:
          entity_id: button.ev5_aktualisierung_erzwingen
    - conditions:
      - condition: trigger
        id: niro_plugged
      - condition: template
        value_template: '{{ states(''sensor.e_niro_zuletzt_aktualisiert'') not in [''unknown'', ''unavailable'', ''none''] and (as_timestamp(now()) - as_timestamp(states(''sensor.e_niro_zuletzt_aktualisiert''), 0)) > 7200 }}'
      sequence:
      - action: button.press
        continue_on_error: true
        target:
          entity_id: button.e_niro_aktualisierung_erzwingen
    - conditions:
      - condition: trigger
        id: daily_check
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''sensor.ev5_zuletzt_aktualisiert'') not in [''unknown'', ''unavailable'', ''none''] and (as_timestamp(now()) - as_timestamp(states(''sensor.ev5_zuletzt_aktualisiert''), 0)) > 43200 and (states(''sensor.ev5_ladestand_der_batterie'') | float(80)) >= 60 }}'
        then:
        - action: button.press
          continue_on_error: true
          target:
            entity_id: button.ev5_aktualisierung_erzwingen
        - delay:
            seconds: 45
        - if:
          - condition: template
            value_template: '{{ states(''sensor.ev5_zuletzt_aktualisiert'') not in [''unknown'', ''unavailable'', ''none''] and (as_timestamp(now()) - as_timestamp(states(''sensor.ev5_zuletzt_aktualisiert''), 0)) > 43200 }}'
          then:
          - action: notify.mobile_app_karl_s_s26
            continue_on_error: true
            data:
              title: '📡 KIA EV5: Modem reagiert nicht'
              message: 'Trotz Aufweck-Befehl seit {{ ((as_timestamp(now()) - as_timestamp(states(''sensor.ev5_zuletzt_aktualisiert''), 0)) / 3600) | round(1) }} Std. kein Kontakt (letzter Stand: {{ states(''sensor.ev5_ladestand_ev_batterie'') }} %). Falls nicht im Funkloch: Im Auto kurz ‚Kia Connect → Neu konfigurieren‘ tippen.'
              data:
                tag: ev5_modem_hang
- id: '202611180004'
  alias: Fronius KS Speicher Auto-Reload bei unavailable
  description: Lädt die Fronius-Integration Klein Schoderleh neu, falls der Reserva-Speicher nach einem HA-Neustart auf unavailable hängen bleibt.
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.reserva_ks_ladezustand
    to: unavailable
    for:
      minutes: 3
  actions:
  - action: homeassistant.reload_config_entry
    continue_on_error: true
    data:
      entry_id: 01M7J9DTBD13Z3XBRKWAPDVX5V
- id: '202611240001'
  alias: KIA Connect Auto-Reload bei unavailable
  description: Lädt die betroffene kia_uvo-Integration einmalig neu (mit 2 Std. Sperrfrist), falls EV5 oder e-Niro 30 Min. auf unavailable hängen (z. B. nach Kia-EU HTTP 502/500).
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.ev5_ladestand_ev_batterie
    to: unavailable
    for:
      minutes: 30
  - trigger: state
    entity_id: sensor.e_niro_ladestand_ev_batterie
    to: unavailable
    for:
      minutes: 30
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 7200 }}'
  actions:
  - if:
    - condition: state
      entity_id: sensor.ev5_ladestand_ev_batterie
      state: unavailable
    then:
    - action: homeassistant.reload_config_entry
      continue_on_error: true
      data:
        entry_id: 01M7JCAN3Q90FRNA02AMABNQ2F
  - if:
    - condition: state
      entity_id: sensor.e_niro_ladestand_ev_batterie
      state: unavailable
    then:
    - action: homeassistant.reload_config_entry
      continue_on_error: true
      data:
        entry_id: 01M7MENVS5STNPSA9CP1RJD6C4
- id: '202611230001'
  alias: EV5 Automatisches Abend-Absperren (21:30)
  description: Sperrt den KIA EV5 abends um 21:30 Uhr automatisch ab, falls er daheim unverschlossen und mit geschlossenen Türen parkt.
  mode: single
  triggers:
  - trigger: time
    at: '21:30:00'
  conditions:
  - condition: state
    entity_id: device_tracker.ev5_ort
    state: home
  - condition: state
    entity_id: binary_sensor.ev5_motor
    state: 'off'
  - condition: state
    entity_id: lock.ev5_zentralverriegelung
    state: unlocked
  - condition: state
    entity_id: binary_sensor.ev5_tur_vorne_links
    state: 'off'
  - condition: state
    entity_id: binary_sensor.ev5_tur_vorne_rechts
    state: 'off'
  - condition: state
    entity_id: binary_sensor.ev5_tur_hinten_links
    state: 'off'
  - condition: state
    entity_id: binary_sensor.ev5_tur_hinten_rechts
    state: 'off'
  - condition: state
    entity_id: binary_sensor.ev5_kofferraum
    state: 'off'
  actions:
  - action: lock.lock
    continue_on_error: true
    target:
      entity_id: lock.ev5_zentralverriegelung
- id: '1795534600000'
  alias: 3D Drucker Idle-Heiz-Schutz
  description: Schaltet Shelly ab, wenn Hotend >150 Grad seit 15 min ohne aktiven Druck heizt
  trigger:
  - platform: numeric_state
    entity_id:
    - sensor.octoprint_actual_tool0_temp
    above: 150
    for:
      hours: 0
      minutes: 15
      seconds: 0
  condition:
  - condition: state
    entity_id: binary_sensor.octoprint_printing
    state: 'off'
  action:
  - action: notify.mobile_app_karl_s_s26
    data:
      message: 3D Drucker heizt >150 °C seit 15 min ohne aktiven Druck – schalte ab!
  - action: switch.turn_off
    target:
      entity_id: switch.shellyplugsg3_d885ac1fdc34
  mode: single
