- id: '202611160007'
  alias: go-e KS KIA EV5 Benachrichtigungen
  description: Push-Benachrichtigungen für KIA EV5
  triggers:
  - trigger: state
    entity_id: binary_sensor.goe_337853_car_0
    from: 'off'
    to: 'on'
    id: plugged
  - trigger: state
    entity_id: binary_sensor.goe_337853_car_0
    from: 'on'
    to: 'off'
    id: unplugged
  - trigger: state
    entity_id: sensor.goe_337853_car_value
    to: Laden
    id: charging_start
  - trigger: template
    value_template: '{{ is_state(''binary_sensor.goe_337853_car_0'', ''on'') and (states(''input_number.goe_ks_auto_soc_dummy'')
      | float(0)) >= (states(''input_number.goe_ks_auto_ziel_soc'') | float(80)) }}'
    id: target_reached
  conditions:
  - condition: state
    entity_id: input_boolean.goe_ks_notify
    state: 'on'
  actions:
  - variables:
      auto_soc: '{{ states(''input_number.goe_ks_auto_soc_dummy'') | int(0) }}'
      auto_ziel: '{{ states(''input_number.goe_ks_auto_ziel_soc'') | int(80) }}'
      modus: '{{ states(''input_select.goe_ks_lademodus'') }}'
      fc: '{{ states(''sensor.energy_production_tomorrow_2'') | float(0) | round(1)
        }}'
      kwh: '{{ states(''sensor.goe_337853_wh'') | float(0) | round(1) }}'
      power_kw: '{{ (states(''sensor.goe_337853_nrg_11'') | float(0) / 1000) | round(1)
        }}'
  - choose:
    - conditions:
      - condition: trigger
        id: plugged
      sequence:
      - action: notify.mobile_app_karl_s_s26
        data:
          title: KIA EV5 angesteckt
          message: 'Akku: {{ auto_soc }} % (Ziel: {{ auto_ziel }} %) · Modus: {{ modus
            }} · PV-Forecast morgen: {{ fc }} kWh'
    - conditions:
      - condition: trigger
        id: charging_start
      sequence:
      - action: notify.mobile_app_karl_s_s26
        data:
          title: KIA EV5 lädt
          message: 'Ladung gestartet ({{ power_kw }} kW) · Akku: {{ auto_soc }} %
            → {{ auto_ziel }} % · Modus: {{ modus }}'
    - conditions:
      - condition: trigger
        id: target_reached
      sequence:
      - action: notify.mobile_app_karl_s_s26
        data:
          title: 'KIA EV5: Ladeziel erreicht'
          message: 'Akku bei {{ auto_soc }} % (Ziel {{ auto_ziel }} %) · Geladen:
            {{ kwh }} kWh. Wallbox pausiert.'
    - conditions:
      - condition: trigger
        id: unplugged
      sequence:
      - action: notify.mobile_app_karl_s_s26
        data:
          title: KIA EV5 abgesteckt
          message: 'Session beendet · Geladen: {{ kwh }} kWh · Aktueller Akku: {{
            auto_soc }} %'
  mode: queued
