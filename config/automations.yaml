      auto_ziel: '{{ states(''input_number.goe_ks_auto_ziel_soc'') | int(80) }}'
      modus: '{{ states(''input_select.goe_ks_lademodus'') }}'
      fc: '{{ states(''sensor.pv_prognose_morgen_klein_schoderleh'') | float(0) | round(1)
        }}'
      kwh: '{{ states(''sensor.goe_337853_wh'') | float(0) | round(1) }}'
