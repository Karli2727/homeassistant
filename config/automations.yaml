      - action: notify.mobile_app_karl_s_s26
        data:
          title: 'KIA EV5: Ladeziel erreicht'
          message: 'Akku bei {{ auto_soc }} % (Ziel {{ auto_ziel }} %) · Geladen:
            {{ kwh }} kWh. Wallbox pausiert.'
    - conditions:
