- id: '1780849447234'
  alias: Schwimmer 24h Warnung
  description: Alarm bei Schwimmer >60s aktiv und beide Pumpen aus (Wiederholung nach 24h)
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.schalter_schwimmer_24v_input_0
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 60
  conditions:
  - condition: state
    entity_id: switch.pumpe_1
    state: 'off'
  - condition: state
    entity_id: switch.pumpe_2
    state: 'off'
  actions:
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.schalter_schwimmer_24v_input_0
        state: 'on'
      - condition: state
        entity_id: switch.pumpe_1
        state: 'off'
      - condition: state
        entity_id: switch.pumpe_2
        state: 'off'
      sequence:
      - action: notify.mobile_app_karl_s_s26
        metadata: {}
        data:
          title: Schwimmer Alarm
          message: Schwimmer 24V seit >60s aktiv, aber Pumpe 1 und Pumpe 2 sind aus!
      - action: notify.mobile_app_sm_helmuth
        metadata: {}
        data:
          title: Schwimmer Alarm
          message: Schwimmer 24V seit >60s aktiv, aber Pumpe 1 und Pumpe 2 sind aus!
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - binary_sensor.schalter_schwimmer_24v_input_0
          to:
          - 'off'
        - trigger: state
          entity_id:
          - switch.pumpe_1
          to:
          - 'on'
        - trigger: state
          entity_id:
          - switch.pumpe_2
          to:
          - 'on'
        timeout:
          hours: 24
          minutes: 0
          seconds: 0
  mode: single
