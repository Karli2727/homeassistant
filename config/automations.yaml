- id: '202611160001'
  alias: go-e KS Modus-Umschaltung
  description: Reagiert sofort auf Moduswechsel für go-e Klein Schoderleh (inkl. Hardware-Fallback lmo=4)
  triggers:
  - trigger: state
    entity_id: input_select.goe_ks_lademodus
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.goe_ks_lademodus
        state: Manuell (App / Frei)
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''select.goe_337853_lmo'') != ''3'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.goe_337853_lmo
          data:
            option: '3'
      - if:
        - condition: template
          value_template: '{{ states(''select.goe_337853_psm'') != ''0'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.goe_337853_psm
          data:
            option: '0'
      - if:
        - condition: template
          value_template: '{{ (states(''number.goe_337853_amp'') | int(-1)) != 16 }}'
        then:
        - action: number.set_value
          target:
            entity_id: number.goe_337853_amp
          data:
            value: 16
      - if:
        - condition: template
          value_template: '{{ states(''select.goe_337853_frc'') != ''0'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.goe_337853_frc
          data:
            option: '0'
    - conditions:
      - condition: state
        entity_id: input_select.goe_ks_lademodus
        state: Aus
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''select.goe_337853_lmo'') != ''4'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.goe_337853_lmo
          data:
            option: '4'
      - if:
        - condition: template
          value_template: '{{ states(''select.goe_337853_frc'') != ''1'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.goe_337853_frc
          data:
            option: '1'
    - conditions:
      - condition: state
        entity_id: input_select.goe_ks_lademodus
        state: Sofort (Max)
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''select.goe_337853_lmo'') != ''4'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.goe_337853_lmo
          data:
            option: '4'
      - if:
        - condition: template
          value_template: '{{ states(''select.goe_337853_psm'') != ''2'' }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.goe_337853_psm
          data:
            option: '2'
      - if:
        - condition: template
          value_template: '{{ (states(''number.goe_337853_amp'') | int(-1)) != 16 }}'
        then:
        - action: number.set_value
          target:
            entity_id: number.goe_337853_amp
          data:
            value: 16
      - if:
        - condition: template
          value_template: '{{ states(''select.goe_337853_frc'') != ''2'' or not is_state(''binary_sensor.goe_337853_alw'', ''on'') }}'
        then:
        - action: select.select_option
          target:
            entity_id: select.goe_337853_frc
          data:
            option: '2'
    default:
    - if:
      - condition: template
        value_template: '{{ states(''select.goe_337853_lmo'') != ''4'' }}'
      then:
      - action: select.select_option
        target:
          entity_id: select.goe_337853_lmo
        data:
          option: '4'
  mode: restart
