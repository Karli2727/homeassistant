- id: '202611160009'
  alias: go-e Wintermodus Automatik (Nov-Feb / Forecast)
  description: Aktiviert Wintermodus automatisch Nov-Feb bei niedrigem PV-Forecast
    und deaktiviert ihn ab März bei gutem Forecast
  triggers:
  - trigger: time
    at: 06:00:00
  conditions: []
  actions:
  - variables:
      is_winter_months: '{{ now().month in [11, 12, 1, 2] }}'
      fc: '{{ states(''sensor.energy_production_tomorrow_2'') | float(0) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_winter_months and fc < 15 }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.goe_ks_wintermodus
          - input_boolean.goe_gs_wintermodus
    - conditions:
      - condition: template
        value_template: '{{ (not is_winter_months) and fc >= 15 }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.goe_ks_wintermodus
          - input_boolean.goe_gs_wintermodus
  mode: single
