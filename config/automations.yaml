- id: '202611160002'
  alias: go-e KS PV-Überschuss & Smart Regelung
  description: Dynamische 1p/3p PV-Überschuss- und Smart-Auto-Prio-Regelung für go-e
    Klein Schoderleh
  triggers:
  - trigger: time_pattern
    seconds: /30
  conditions:
  - condition: state
    entity_id: binary_sensor.goe_337853_car_0
    state: 'on'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_select.goe_ks_lademodus
      state: PV-Überschuss
    - condition: state
      entity_id: input_select.goe_ks_lademodus
      state: PV + Eco (Batterieschutz)
    - condition: state
      entity_id: input_select.goe_ks_lademodus
      state: Smart (Auto-Prio)
  actions:
  - variables:
      modus: '{{ states(''input_select.goe_ks_lademodus'') }}'
      soc: '{{ states(''sensor.reserva_ks_ladezustand'') | float(0) }}'
      min_soc: '{{ states(''input_number.goe_ks_min_soc'') | float(20) }}'
      prio_soc: '{{ states(''input_number.goe_ks_bat_prio_soc'') | float(50) }}'
      auto_soc: '{{ states(''input_number.goe_ks_auto_soc_dummy'') | float(50) }}'
      auto_ziel: '{{ states(''input_number.goe_ks_auto_ziel_soc'') | float(80) }}'
      auto_min: '{{ states(''input_number.goe_ks_auto_min_soc'') | float(30) }}'
      fc_morgen: '{{ states(''sensor.energy_production_tomorrow_2'') | float(0) }}'
      fc_schwelle: '{{ states(''input_number.goe_ks_forecast_schwelle'') | float(12)
        }}'
      wintermodus: '{{ is_state(''input_boolean.goe_ks_wintermodus'', ''on'') }}'
      is_night: '{{ now().hour >= 20 or now().hour < 6 }}'
      einspeisung: '{{ states(''sensor.solarnet_ks_leistung_netzeinspeisung'') | float(0)
        }}'
      bezug: '{{ states(''sensor.solarnet_ks_leistung_netzbezug'') | float(0) }}'
      bat_lade: '{{ states(''sensor.solarnet_ks_ladeleistung'') | float(0) }}'
      car_w: '{{ states(''sensor.goe_337853_nrg_11'') | float(0) }}'
      surplus: '{{ (einspeisung - bezug + car_w + (bat_lade if soc >= prio_soc else
        0)) | float(0) }}'
      is_charging: '{{ states(''select.goe_337853_frc'') == ''2'' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ auto_soc >= auto_ziel }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_337853_frc
        data:
          option: '1'
    - conditions:
      - condition: template
        value_template: '{{ modus == ''Smart (Auto-Prio)'' and (wintermodus or auto_soc
          < auto_min or (fc_morgen < fc_schwelle and is_night)) }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_337853_psm
        data:
          option: '2'
      - action: number.set_value
        target:
          entity_id: number.goe_337853_amp
        data:
          value: 16
      - action: select.select_option
        target:
          entity_id: select.goe_337853_frc
        data:
          option: '2'
    - conditions:
      - condition: template
        value_template: '{{ surplus >= 4200 }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_337853_psm
        data:
          option: '2'
      - action: number.set_value
        target:
          entity_id: number.goe_337853_amp
        data:
          value: '{{ [16, [6, (surplus / 690) | int] | max] | min }}'
      - action: select.select_option
        target:
          entity_id: select.goe_337853_frc
        data:
          option: '2'
    - conditions:
      - condition: template
        value_template: '{{ surplus >= 1380 or (is_charging and surplus >= 1100) }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_337853_psm
        data:
          option: '1'
      - action: number.set_value
        target:
          entity_id: number.goe_337853_amp
        data:
          value: '{{ [16, [6, (surplus / 230) | int] | max] | min }}'
      - action: select.select_option
        target:
          entity_id: select.goe_337853_frc
        data:
          option: '2'
    - conditions:
      - condition: template
        value_template: '{{ modus == ''PV + Eco (Batterieschutz)'' and soc > min_soc
          }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_337853_psm
        data:
          option: '1'
      - action: number.set_value
        target:
          entity_id: number.goe_337853_amp
        data:
          value: 6
      - action: select.select_option
        target:
          entity_id: select.goe_337853_frc
        data:
          option: '2'
    default:
    - action: select.select_option
      target:
        entity_id: select.goe_337853_frc
      data:
        option: '1'
  mode: single
- id: '202611160004'
  alias: go-e GS PV-Überschuss & Smart Regelung
  description: Dynamische 1p/3p PV-Überschuss- und Smart-Auto-Prio-Regelung für go-e
    Gut Schoderleh
  triggers:
  - trigger: time_pattern
    seconds: /30
  conditions:
  - condition: state
    entity_id: binary_sensor.goe_081320_car_0
    state: 'on'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_select.goe_gs_lademodus
      state: PV-Überschuss
    - condition: state
      entity_id: input_select.goe_gs_lademodus
      state: PV + Eco (Batterieschutz)
    - condition: state
      entity_id: input_select.goe_gs_lademodus
      state: Smart (Auto-Prio)
  actions:
  - variables:
      modus: '{{ states(''input_select.goe_gs_lademodus'') }}'
      soc: '{{ states(''sensor.byd_battery_box_gs_ladezustand'') | float(0) }}'
      min_soc: '{{ states(''input_number.goe_gs_min_soc'') | float(20) }}'
      prio_soc: '{{ states(''input_number.goe_gs_bat_prio_soc'') | float(50) }}'
      auto_soc: '{{ states(''input_number.goe_gs_auto_soc_dummy'') | float(50) }}'
      auto_ziel: '{{ states(''input_number.goe_gs_auto_ziel_soc'') | float(80) }}'
      auto_min: '{{ states(''input_number.goe_gs_auto_min_soc'') | float(30) }}'
      fc_morgen: '{{ states(''sensor.energy_production_tomorrow_2'') | float(0) }}'
      fc_schwelle: '{{ states(''input_number.goe_gs_forecast_schwelle'') | float(12)
        }}'
      wintermodus: '{{ is_state(''input_boolean.goe_gs_wintermodus'', ''on'') }}'
      is_night: '{{ now().hour >= 20 or now().hour < 6 }}'
      einspeisung: '{{ states(''sensor.solarnet_gs_leistung_netzeinspeisung'') | float(0)
        }}'
      bezug: '{{ states(''sensor.solarnet_gs_leistung_netzbezug'') | float(0) }}'
      bat_lade: '{{ states(''sensor.solarnet_gs_ladeleistung'') | float(0) }}'
      car_w: '{{ states(''sensor.goe_081320_nrg_11'') | float(0) }}'
      surplus: '{{ (einspeisung - bezug + car_w + (bat_lade if soc >= prio_soc else
        0)) | float(0) }}'
      is_charging: '{{ states(''select.goe_081320_frc'') == ''2'' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ auto_soc >= auto_ziel }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_081320_frc
        data:
          option: '1'
    - conditions:
      - condition: template
        value_template: '{{ modus == ''Smart (Auto-Prio)'' and (wintermodus or auto_soc
          < auto_min or (fc_morgen < fc_schwelle and is_night)) }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_081320_psm
        data:
          option: '2'
      - action: number.set_value
        target:
          entity_id: number.goe_081320_amp
        data:
          value: 16
      - action: select.select_option
        target:
          entity_id: select.goe_081320_frc
        data:
          option: '2'
    - conditions:
      - condition: template
        value_template: '{{ surplus >= 4200 }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_081320_psm
        data:
          option: '2'
      - action: number.set_value
        target:
          entity_id: number.goe_081320_amp
        data:
          value: '{{ [16, [6, (surplus / 690) | int] | max] | min }}'
      - action: select.select_option
        target:
          entity_id: select.goe_081320_frc
        data:
          option: '2'
    - conditions:
      - condition: template
        value_template: '{{ surplus >= 1380 or (is_charging and surplus >= 1100) }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_081320_psm
        data:
          option: '1'
      - action: number.set_value
        target:
          entity_id: number.goe_081320_amp
        data:
          value: '{{ [16, [6, (surplus / 230) | int] | max] | min }}'
      - action: select.select_option
        target:
          entity_id: select.goe_081320_frc
        data:
          option: '2'
    - conditions:
      - condition: template
        value_template: '{{ modus == ''PV + Eco (Batterieschutz)'' and soc > min_soc
          }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.goe_081320_psm
        data:
          option: '1'
      - action: number.set_value
        target:
          entity_id: number.goe_081320_amp
        data:
          value: 6
      - action: select.select_option
        target:
          entity_id: select.goe_081320_frc
        data:
          option: '2'
    default:
    - action: select.select_option
      target:
        entity_id: select.goe_081320_frc
      data:
        option: '1'
  mode: single
- id: '202611160005'
  alias: go-e KS Ladeziel Reset auf 80%
  description: Setzt das Auto-Ladeziel beim Abstecken wieder auf 80% zurück
  triggers:
