    to: 'on'
    id: plugged
  - trigger: state
    entity_id: binary_sensor.goe_337853_car_0
    from: 'on'
    to: 'off'
    id: unplugged
  - trigger: state
    entity_id: sensor.goe_337853_car_value
    to: Laden
    id: charging_start
  - trigger: template
    value_template: '{{ is_state(''binary_sensor.goe_337853_car_0'', ''on'') and (states(''sensor.ev5_ladestand_ev_batterie'')
      | float(states(''input_number.goe_ks_auto_soc_dummy'') | float(0))) >= (states(''input_number.goe_ks_auto_ziel_soc'')
      | float(80)) }}'
