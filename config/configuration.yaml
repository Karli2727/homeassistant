template:
  - sensor:
      - name: "Gut Schoderleh PV-Leistung Gesamt"
        unique_id: gut_schoderleh_pv_leistung_gesamt
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p_gen24 = states('sensor.solarnet_gs_pv_leistung') | float(0) %}
          {% set p_symo1 = states('sensor.symo_15_0_3_m_1_leistung_ac') | float(0) %}
          {% set p_symo2 = states('sensor.symo_15_0_3_m_2_leistung_ac') | float(0) %}
          {{ (p_gen24 + p_symo1 + p_symo2) | round(0) }}

      - name: "Gut Schoderleh PV Teil 1 Leistung"
        unique_id: gut_schoderleh_pv_teil_1_leistung
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.symo_15_0_3_m_1_leistung_ac') | float(0) | round(0) }}"

      - name: "Gut Schoderleh PV Teil 2 Leistung"
        unique_id: gut_schoderleh_pv_teil_2_leistung
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.symo_15_0_3_m_2_leistung_ac') | float(0) | round(0) }}"

      - name: "Gut Schoderleh Gesamtverbrauch Echt"
        unique_id: gut_schoderleh_gesamtverbrauch_echt
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv_tot = states('sensor.gut_schoderleh_pv_leistung_gesamt') | float(0) %}
          {% set bezug = states('sensor.solarnet_gs_leistung_netzbezug') | float(0) %}
          {% set einspeisung = states('sensor.solarnet_gs_leistung_netzeinspeisung') | float(0) %}
          {% set bat_entlade = states('sensor.solarnet_gs_entladeleistung') | float(0) %}
          {% set bat_lade = states('sensor.solarnet_gs_ladeleistung') | float(0) %}
          {{ [0, (pv_tot + bezug - einspeisung + bat_entlade - bat_lade) | round(0)] | max }}

      - name: "Schoderleh PV-Leistung Gesamt"
        unique_id: schoderleh_pv_leistung_gesamt
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ ((states('sensor.gut_schoderleh_pv_leistung_gesamt') | float(0)) + (states('sensor.solarnet_ks_pv_leistung') | float(0))) | round(0) }}

      - name: "Schoderleh Gesamtverbrauch"
        unique_id: schoderleh_gesamtverbrauch
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ ((states('sensor.gut_schoderleh_gesamtverbrauch_echt') | float(0)) + (states('sensor.solarnet_ks_leistung_verbrauch') | float(0))) | round(0) }}

      - name: "Schoderleh Netzbezug Gesamt"
        unique_id: schoderleh_netzbezug_gesamt
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ ((states('sensor.solarnet_gs_leistung_netzbezug') | float(0)) + (states('sensor.solarnet_ks_leistung_netzbezug') | float(0))) | round(0) }}

      - name: "Schoderleh Netzeinspeisung Gesamt"
        unique_id: schoderleh_netzeinspeisung_gesamt
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ ((states('sensor.solarnet_gs_leistung_netzeinspeisung') | float(0)) + (states('sensor.solarnet_ks_leistung_netzeinspeisung') | float(0))) | round(0) }}

      - name: "Schoderleh Speicher Ladeleistung Gesamt"
        unique_id: schoderleh_speicher_ladeleistung_gesamt
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ ((states('sensor.solarnet_gs_ladeleistung') | float(0)) + (states('sensor.solarnet_ks_ladeleistung') | float(0))) | round(0) }}

      - name: "Schoderleh Speicher Entladeleistung Gesamt"
        unique_id: schoderleh_speicher_entladeleistung_gesamt
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ ((states('sensor.solarnet_gs_entladeleistung') | float(0)) + (states('sensor.solarnet_ks_entladeleistung') | float(0))) | round(0) }}

      - name: "PV-Prognose Morgen Klein Schoderleh"
        unique_id: pv_forecast_morgen_klein_schoderleh
        unit_of_measurement: "kWh"
        device_class: energy
        icon: "mdi:weather-sunny"
        state: >
          {{ ((states('sensor.energy_production_tomorrow_2') | float(0)) * (10.52 / 8.0)) | round(1) }}

      - name: "PV-Prognose Morgen Gut Schoderleh"
        unique_id: pv_forecast_morgen_gut_schoderleh
        unit_of_measurement: "kWh"
        device_class: energy
        icon: "mdi:weather-sunny"
        state: >
          {{ ((states('sensor.energy_production_tomorrow_2') | float(0)) * (28.50 / 8.0)) | round(1) }}

      - name: "go-e KS Spitzenlast-Schutz Status"
        unique_id: goe_ks_spitzenlast_status
        icon: "mdi:shield-flash"
        state: >
          {% set max_w = (states('input_number.goe_ks_max_netzbezug_kw') | float(11)) * 1000 %}
          {% set bezug = states('sensor.solarnet_ks_leistung_netzbezug') | float(0) %}
          {% set einsp = states('sensor.solarnet_ks_leistung_netzeinspeisung') | float(0) %}
          {% set car_w = states('sensor.goe_337853_nrg_11') | float(0) %}
          {% set avail_w = [0, (max_w - (bezug - einsp - car_w)) | round(0)] | max %}
          {% if avail_w < 1380 %}
            Limit voll ({{ (bezug / 1000) | round(1) }} / {{ (max_w / 1000) | round(1) }} kW – Pause)
          {% elif car_w > 100 and avail_w < 11000 and bezug > (max_w * 0.85) %}
            Gedrosselt (max. {{ (avail_w / 1000) | round(1) }} kW frei)
          {% else %}
            Frei ({{ (bezug / 1000) | round(1) }} / {{ (max_w / 1000) | round(1) }} kW)
          {% endif %}

      - name: "go-e GS Spitzenlast-Schutz Status"
        unique_id: goe_gs_spitzenlast_status
        icon: "mdi:shield-flash"
        state: >
          {% set max_w = (states('input_number.goe_gs_max_netzbezug_kw') | float(15)) * 1000 %}
          {% set bezug = states('sensor.solarnet_gs_leistung_netzbezug') | float(0) %}
          {% set einsp = states('sensor.solarnet_gs_leistung_netzeinspeisung') | float(0) %}
          {% set car_w = states('sensor.goe_081320_nrg_11') | float(0) %}
          {% set avail_w = [0, (max_w - (bezug - einsp - car_w)) | round(0)] | max %}
          {% if avail_w < 1380 %}
            Limit voll ({{ (bezug / 1000) | round(1) }} / {{ (max_w / 1000) | round(1) }} kW – Pause)
          {% elif car_w > 100 and avail_w < 11000 and bezug > (max_w * 0.85) %}
            Gedrosselt (max. {{ (avail_w / 1000) | round(1) }} kW frei)
          {% else %}
            Frei ({{ (bezug / 1000) | round(1) }} / {{ (max_w / 1000) | round(1) }} kW)
          {% endif %}

      - name: "EEG-Überschuss Status"
        unique_id: eeg_ueberschuss_status
        icon: "mdi:transmission-tower-import"
        state: >
          {% set active = is_state('input_boolean.eeg_ueberschuss_aktiv', 'on') %}
          {% set hof_einsp = [0, (states('sensor.solarnet_gs_leistung_netzeinspeisung') | float(0)) - (states('sensor.solarnet_gs_leistung_netzbezug') | float(0))] | max %}
          {% set ks_soc = states('sensor.reserva_ks_ladezustand') | float(0) %}
          {% set bat_ziel = states('input_number.eeg_ks_batterie_ziel_soc') | float(90) %}
          {% set bat_lade = states('sensor.solarnet_ks_ladeleistung') | float(0) %}
          {% if not active %}
            AUS (Wartet auf EEG-Freigabe – aktuell getrennte Zähler)
          {% elif hof_einsp >= 600 and ks_soc < bat_ziel and bat_lade > 300 %}
            Aktiv: Speicher KS lädt ({{ (bat_lade / 1000) | round(2) }} kW · Hof liefert {{ (hof_einsp / 1000) | round(2) }} kW)
          {% elif hof_einsp >= 600 %}
            Aktiv: {{ (hof_einsp / 1000) | round(2) }} kW Hof-Überschuss verfügbar
          {% else %}
            Bereit (Kein Hof-Überschuss · {{ (hof_einsp / 1000) | round(2) }} kW)
          {% endif %}

  - trigger:
      - trigger: state
        entity_id: input_boolean.pumpe_1_aus_helfer
        not_from:
          - unknown
          - unavailable
        not_to:
          - unknown
          - unavailable
    sensor:
      - name: "Pumpe 1 Letzte Pumpung"
        unique_id: pumpe_1_letzte_pumpung_trigger
        unit_of_measurement: "min"
        icon: "mdi:clock-time-eight-outline"
        state: >
          {% set an = as_timestamp(states.input_boolean.pumpe_1_an_helfer.last_changed, 0) %}
          {% set diff = as_timestamp(now()) - an %}
          {% if an > 0 and diff > 5 %}
            {{ (diff / 60) | round(1) }}
          {% else %}
            {{ this.state | default(0.0) }}
          {% endif %}

  - trigger:
      - trigger: state
        entity_id: input_boolean.pumpe_2_aus_helfer
        not_from:
          - unknown
          - unavailable
        not_to:
          - unknown
          - unavailable
    sensor:
      - name: "Pumpe 2 Letzte Pumpung"
        unique_id: pumpe_2_letzte_pumpung_trigger
        unit_of_measurement: "min"
        icon: "mdi:clock-time-eight-outline"
        state: >
          {% set an = as_timestamp(states.input_boolean.pumpe_2_an_helfer.last_changed, 0) %}
          {% set diff = as_timestamp(now()) - an %}
          {% if an > 0 and diff > 5 %}
            {{ (diff / 60) | round(1) }}
          {% else %}
            {{ this.state | default(0.0) }}
          {% endif %}

