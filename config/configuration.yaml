#loads default set of integrations. Do not remove.
default_config:

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.16.0.0/12
    - 192.168.1.0/24

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524400

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml


homeassistant:
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - 192.168.0.0/24
        - 172.17.0.0/24
  customize:
    sensor.brunnen_1_stunde:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.brunnen_2_stunde:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.brunnen_1_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.brunnen_2_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.brunnen_gesamt_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_gesamt_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_gut_schoderleh_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_stall_gebaude_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_klein_schoderleh_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_traenker_1_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_traenker_2_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_traenker_3_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_stall_eingang_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_haus_eingang_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_menschen_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.durchfluss_pferde_jahresverbrauch:
      unit_of_measurement: "L"
      state_class: total_increasing
    sensor.brunnen_gesamt:
      unit_of_measurement: "L"
      state_class: measurement
    sensor.durchfluss_gut_schoderleh:
      unit_of_measurement: "L"
      state_class: measurement
    sensor.durchfluss_gesamt:
      unit_of_measurement: "L"
      state_class: measurement
    sensor.durchfluss_delta:
      unit_of_measurement: "L"
      state_class: measurement
    sensor.durchfluss_stall_gebaude_2:
      unit_of_measurement: "L"
      state_class: measurement
    sensor.durchfluss_menschen:
      unit_of_measurement: "L"
      state_class: measurement
    sensor.durchfluss_pferde:
