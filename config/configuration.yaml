sensor:
  - platform: rest
    resource: http://172.17.0.130/addons/xmlapi/state.cgi?sid=bJMKHGgBfFMQocIi&device_id=8188
    name: Pegelstand Zisterne API
    value_template: "{{ value_json['state']['device']['channel'][1]['datapoint']['@value']}}"
    state_class: "measurement"
    unit_of_measurement: '%'
    scan_interval: 60

  - platform: rest
    resource: http://172.17.0.130/addons/xmlapi/state.cgi?sid=bJMKHGgBfFMQocIi&device_id=8220
    name: Pegelstand Gartenwasser API
    value_template: "{{ value_json['state']['device']['channel'][1]['datapoint']['@value']}}"
    state_class: "measurement"
    unit_of_measurement: '%'
    scan_interval: 60

  - platform: rest
    resource: http://172.17.0.130/addons/xmlapi/state.cgi?sid=bJMKHGgBfFMQocIi&device_id=8220
    name: Pegelstand Gartenwasser Timestamp
    value_template: "{{ value_json['state']['device']['channel'][1]['@lastdpactiontime']|int(0) | timestamp_custom('%d.%m.%Y  %X') }}"
    scan_interval: 60

  - platform: rest
    resource: http://172.17.0.130/addons/xmlapi/state.cgi?sid=bJMKHGgBfFMQocIi&device_id=8188
    name: Pegelstand Zisterne Timestamp
    value_template: "{{ value_json['state']['device']['channel'][1]['@lastdpactiontime']|int(0) | timestamp_custom('%d.%m.%Y  %X') }}"
    scan_interval: 60

rest_command:
  schalterelektrozaunan:
    url: http://172.17.0.182/cm?cmnd=Power%20on
    method: POST
  schalterelektrozaunaus:
    url: http://172.17.0.182/cm?cmnd=Power%20off
    method: POST

template:
  - trigger:
      - trigger: state
        entity_id: input_boolean.pumpe_1_aus_helfer
        not_from:
          - unknown
          - unavailable
        not_to:
          - unknown
          - unavailable
    sensor:
      - name: "Pumpe 1 Letzte Pumpung"
        unique_id: pumpe_1_letzte_pumpung_trigger
        unit_of_measurement: "min"
        icon: "mdi:clock-time-eight-outline"
        state: >
          {% set an = as_timestamp(states.input_boolean.pumpe_1_an_helfer.last_changed, 0) %}
          {% set diff = as_timestamp(now()) - an %}
          {% if an > 0 and diff > 5 %}
            {{ (diff / 60) | round(1) }}
          {% else %}
            {{ this.state | default(0.0) }}
          {% endif %}

  - trigger:
      - trigger: state
        entity_id: input_boolean.pumpe_2_aus_helfer
        not_from:
          - unknown
          - unavailable
        not_to:
          - unknown
          - unavailable
    sensor:
      - name: "Pumpe 2 Letzte Pumpung"
        unique_id: pumpe_2_letzte_pumpung_trigger
        unit_of_measurement: "min"
        icon: "mdi:clock-time-eight-outline"
        state: >
          {% set an = as_timestamp(states.input_boolean.pumpe_2_an_helfer.last_changed, 0) %}
          {% set diff = as_timestamp(now()) - an %}
          {% if an > 0 and diff > 5 %}
            {{ (diff / 60) | round(1) }}
          {% else %}
            {{ this.state | default(0.0) }}
          {% endif %}

